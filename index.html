<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>Ashish Raj | BCA Graduate & Web Developer</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="I'm Ashish Raj, a BCA graduate from Muzaffarpur, Bihar, focused on Frontend Development and Java Backend Development. Explore my projects, skills, certifications and resume."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="Ashish Raj, Web Developer, Frontend Developer, Java Developer, React Developer, BCA Graduate, Developer Portfolio"
    />

    <!-- Author -->
    <meta name="author" content="Ashish Raj" />

    <meta name="google-site-verification" content="LpLpOMSXFmNGYBtY53tSAjHeIkqcLqEmgRyrCbMJxhk" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Ashish Raj | BCA Graduate & Web Developer"
    />

    <meta
      property="og:description"
      content="Explore Ashish Raj's developer portfolio, projects, technical skills, certifications and resume."
    />

    <meta property="og:image" content="https://ashish-raj-portfolio.vercel.app/images/portfolio/social-preview-optimized.webp?v=2" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="og:url" content="https://ashish-raj-portfolio.vercel.app/" />

    <meta property="og:site_name" content="Ashish Raj Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Ashish Raj | Developer Portfolio"
    />

    <meta
      name="twitter:description"
      content="Explore my projects, skills and journey in web development."
    />

    <meta name="twitter:image" content="https://ashish-raj-portfolio.vercel.app/images/portfolio/social-preview-optimized.webp?v=2" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#071D18" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
